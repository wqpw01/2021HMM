[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramalhinho-2021-reproduction"
version = "0.2.0"
description = "Organ-prefiltered vascular CBIR and HMM reproduction for Ramalhinho et al. (2021)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
